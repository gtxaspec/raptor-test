# Test target — copy to <name>.conf and fill in. Empty = not applicable.
#
# Sourced by bash: QUOTE any value containing spaces or parentheses
# (NOTES especially). A syntax error aborts sourcing mid-file and
# run-battery reports the target as CONF PARSE ERROR.
SOC=
HOST=
SSH=                 # user@host for --ssh device health, or empty

# rsd (compy) RTSP backend
RTSP_PORT=554
PATH0=stream0
PATH1=stream1

# rsr SRT backend (MPEG-TS), or empty
SRT=

# rsd-555 (live555) RTSP backend, or empty
R555_PORT=
R555_PATH0=stream0
R555_PATH1=stream1

# RHD HTTP endpoints (JPEG snapshot, MJPEG, /audio), or empty
RHD=

# RTSP digest credentials, or empty
USER=
PASS=

# Configured GOP length in frames (asserts the measured keyframe
# interval equals it), or empty for regularity-only
GOP=

# External legs
GO2RTC=
FRIGATE=no
RECORD_CHECK=

# RTSPS/TLS URL (rtsps://host:port/path), or empty
TLS=

# RTMP push: local listen port for rsp to push to (device [push] url
# must point at rtmp://<this-host>:<port>/live/raptortest, and rsp
# must be running on the device), or empty
RTMP=

# WebRTC: rwd WHIP url (H264 stream; https, ?stream=N), or empty.
# Needs tools/webrtc-venv (tools/fetch-tools.sh).
WEBRTC=

NOTES=""

# ── Daemon profiles (optional) ───────────────────────────────────────
# Declare these and run-battery owns the daemon lifecycle: before each
# backend pass it kills every raptor daemon and starts exactly the set
# that pass needs, polling for readiness (rings, pids) rather than
# sleeping. Leave DAEMONS_BASE empty and the runner manages nothing —
# it tests whatever is already running, as it always did.
#
# The base is what a deployed camera of this kind always runs. Service
# daemons belong in it: ROD re-renders the OSD every second and RIC
# polls exposure, so leaving them out would measure a lighter machine
# than any real one. On an ISP-less target (A1, qemu) the base is
# "rfs" instead of "rvd rad".
#
# Backend deltas default to the obvious daemon and rarely need setting;
# each is added only when the corresponding leg is exposed above, and
# the two RTSP backends never run together (no production device
# serves both, so rsd-555 gets its own pass).
#
#DAEMON_BIN=/usr/bin                  # or /mnt/nfs/raptor-binary/<soc>
#DAEMONS_BASE="rvd rad rod ric"       # ISP-less target: "rfs"
#DAEMONS_RECORD="rmd rmr"             # added when RECORD_CHECK is set
#DAEMONS_RTSP="rsd"                   # defaults shown; override only if
#DAEMONS_R555="rsd-555"               # a target names them differently
#DAEMONS_SRT="rsr"
#DAEMONS_RHD="rhd"
#DAEMONS_WEBRTC="rwd"
#DAEMONS_RTMP="rsp"
#DAEMONS_UVC="rwc"                    # USB webcam gadget (no leg yet)
#RAM_MB=128                           # 64MB-class targets have ~19MB of
#                                     # headroom after rmem/ispmem carve:
#                                     # keep their exposed legs few
